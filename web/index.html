<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indra OCR WASM</title>
  <style>
    :root {
      color-scheme: light dark;
      --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-serif: ui-serif, Georgia, serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --bg: #f5f1e8;
      --panel: #fffdf8;
      --ink: #1d1b18;
      --muted: #6e675d;
      --line: #d8d0c2;
      --accent: #c84b31;
      --accent-ink: #fff8f4;
      --code-bg: rgb(29 27 24 / 0.08);
      --code-block-bg: rgb(29 27 24 / 0.05);
      --table-head-bg: rgb(29 27 24 / 0.06);
      --selection-bg: rgb(200 75 49 / 0.58);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171513;
        --panel: #211e1b;
        --ink: #f2ece2;
        --muted: #aaa195;
        --line: #484139;
        --accent: #ef7b5f;
        --accent-ink: #24100c;
        --code-bg: rgb(242 236 226 / 0.08);
        --code-block-bg: rgb(242 236 226 / 0.05);
        --table-head-bg: rgb(242 236 226 / 0.06);
        --selection-bg: rgb(239 123 95 / 0.58);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 var(--font-sans);
    }

    main {
      width: min(1120px, calc(100% - 2rem));
      margin: 2rem auto 4rem;
    }

    header {
      margin-bottom: 1.25rem;
    }

    h1 {
      margin: 0;
      font-family: var(--font-serif);
      font-size: clamp(2rem, 7vw, 4.5rem);
      font-weight: 600;
      letter-spacing: -0.045em;
      line-height: 0.95;
    }

    .subtitle {
      max-width: 38rem;
      margin: 0.75rem 0 0;
      color: var(--muted);
    }

    .subtitle a {
      color: var(--accent);
      text-underline-offset: 0.16em;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      gap: 1rem;
    }

    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      box-shadow: 0 18px 60px rgb(0 0 0 / 0.08);
      overflow: hidden;
    }

    .drop {
      display: grid;
      min-height: 9rem;
      place-items: center;
      padding: 1rem;
      border: 2px dashed var(--line);
      margin: 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .drop:is(:hover, .over) {
      border-color: var(--accent);
    }

    .drop strong {
      display: block;
      font-size: 1.1rem;
    }

    .drop span { color: var(--muted); }
    input[type="file"] { display: none; }

    .preview {
      display: none;
      max-height: 50vh;
      overflow: auto;
      padding: 0 1rem 1rem;
    }

    .preview img {
      width: 100%;
      height: auto;
      border: 1px solid var(--line);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem;
      padding: 1rem;
      border-top: 1px solid var(--line);
    }

    button,
    select {
      font: inherit;
    }

    button {
      appearance: none;
      border: 0;
      padding: 0.75rem 1.15rem;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    label.check {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--muted);
    }

    select {
      margin-left: auto;
      border: 1px solid var(--line);
      padding: 0.65rem 2rem 0.65rem 0.8rem;
      background: var(--panel);
      color: var(--ink);
    }

    .status {
      min-height: 1.5rem;
      padding: 0 1rem 0.75rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .status.error { color: #d33c28; }

    .output-view {
      min-height: 25rem;
      max-height: 72vh;
      overflow: auto;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }

    pre.output-view {
      margin: 0;
      padding: 1rem;
      font: 0.88rem/1.55 var(--font-mono);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .markdown-body {
      padding: 1.4rem clamp(1rem, 4vw, 2rem) 2rem;
      font-size: 1rem;
      line-height: 1.68;
    }

    .markdown-body > :first-child { margin-top: 0; }
    .markdown-body > :last-child { margin-bottom: 0; }

    .markdown-body :is(h1, h2, h3, h4, h5, h6) {
      margin: 1.5em 0 0.55em;
      font-family: var(--font-serif);
      line-height: 1.18;
      letter-spacing: -0.018em;
    }

    .markdown-body h1 { font-size: 2rem; }
    .markdown-body h2 { font-size: 1.55rem; }
    .markdown-body h3 { font-size: 1.25rem; }
    .markdown-body :is(h4, h5, h6) { font-size: 1rem; }

    .markdown-body :is(p, ul, ol, blockquote, pre, table) {
      margin: 0 0 1em;
    }

    .markdown-body a {
      color: var(--accent);
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.16em;
    }

    .markdown-body blockquote {
      padding-left: 1rem;
      border-left: 3px solid var(--accent);
      color: var(--muted);
    }

    .markdown-body code {
      padding: 0.12em 0.3em;
      background: var(--code-bg);
      font: 0.9em/1.45 var(--font-mono);
    }

    .markdown-body pre {
      overflow: auto;
      padding: 0.9rem 1rem;
      border: 1px solid var(--line);
      background: var(--code-block-bg);
    }

    .markdown-body pre code {
      padding: 0;
      background: transparent;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92em;
    }

    .markdown-body th,
    .markdown-body td {
      padding: 0.5rem 0.65rem;
      border: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .markdown-body th {
      background: var(--table-head-bg);
      font-weight: 700;
    }

    .markdown-body img {
      max-width: 100%;
    }

    .markdown-body .empty-output {
      color: var(--muted);
    }

    .overlay-view {
      padding: 1rem;
    }

    .overlay-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 8.5 / 11;
      overflow: hidden;
      border: 1px solid var(--line);
      background-color: var(--panel);
      background-position: center;
      background-repeat: no-repeat;
      background-size: 100% 100%;
    }

    .overlay-text {
      position: absolute;
      inset: 0;
    }

    .overlay-line {
      position: absolute;
      color: transparent;
      white-space: pre;
      cursor: text;
      user-select: text;
      -webkit-user-select: text;
    }

    .overlay-line::selection {
      color: transparent;
      background: var(--selection-bg);
    }

    .overlay-hint {
      margin: 0.75rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 780px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Indra OCR</h1>
        <p class="subtitle">
          <a href="https://github.com/datalab-to/indra">Indra OCR</a> ported to
          Rust/Burn and compiled to WebAssembly running in your browser.
        </p>
      </div>
    </header>

    <section class="grid">
      <div class="panel">
        <label class="drop" id="drop">
          <div>
            <strong>Choose or drop a page</strong>
            <span>PNG, JPEG, or WebP</span>
          </div>
          <input id="file" type="file" accept="image/*">
        </label>
        <div class="controls">
          <button id="run" disabled>Run OCR</button>
          <label class="check">
            <input id="orient" type="checkbox" checked>
            Detect page rotation
          </label>
          <select id="format" aria-label="Output mode">
            <option value="markdown">Rendered Markdown</option>
            <option value="overlay">Original + selectable text</option>
            <option value="json">JSON</option>
          </select>
        </div>
        <div class="status" id="status">Ready.</div>
        <div class="preview" id="previewWrap">
          <img id="preview" alt="Selected page preview">
        </div>
      </div>

      <div class="panel">
        <pre class="output-view" id="output">OCR output will appear here.</pre>
        <article class="output-view markdown-body" id="markdownOutput"></article>
        <div class="output-view overlay-view" id="overlayOutput" hidden>
          <div class="overlay-stage" id="overlayPage">
            <div class="overlay-text" id="overlayText"></div>
          </div>
          <p class="overlay-hint" id="overlayHint">Run OCR to make the detected text selectable.</p>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import init, { WebOcr } from "./pkg/indra_ocr.js";

    let md4xRenderToHtml = null;
    const markdownReady = import(
      "https://cdn.jsdelivr.net/npm/md4x@0.0.30/lib/standalone.mjs"
    ).then(async (md4x) => {
      await md4x.init();
      md4xRenderToHtml = md4x.renderToHtml;
    });
    markdownReady.catch((error) => {
      console.error("Could not initialize the Markdown renderer.", error);
    });

    const fileInput = document.querySelector("#file");
    const drop = document.querySelector("#drop");
    const preview = document.querySelector("#preview");
    const previewWrap = document.querySelector("#previewWrap");
    const runButton = document.querySelector("#run");
    const orient = document.querySelector("#orient");
    const format = document.querySelector("#format");
    const status = document.querySelector("#status");
    const output = document.querySelector("#output");
    const markdownOutput = document.querySelector("#markdownOutput");
    const overlayOutput = document.querySelector("#overlayOutput");
    const overlayPage = document.querySelector("#overlayPage");
    const overlayText = document.querySelector("#overlayText");
    const overlayHint = document.querySelector("#overlayHint");

    let selectedFile = null;
    let previewUrl = null;
    let ocrPromise = null;
    let ocr = null;
    let lastResult = null;
    let sourceSize = null;
    let resultRenderVersion = 0;

    const overlayResizeObserver = "ResizeObserver" in window
      ? new ResizeObserver(() => layoutOverlayLines())
      : null;
    overlayResizeObserver?.observe(overlayPage);

    async function getOcr() {
      if (!ocrPromise) {
        status.textContent = "Compiling and loading the OCR models…";
        ocrPromise = init()
          .then(() => new WebOcr())
          .then((instance) => {
            ocr = instance;
            return instance;
          })
          .catch((error) => {
            ocrPromise = null;
            throw error;
          });
      }
      return ocrPromise;
    }

    function setStatus(text, isError = false) {
      status.textContent = text;
      status.classList.toggle("error", isError);
    }

    function selectFile(file) {
      if (!file || !file.type.startsWith("image/")) {
        setStatus("Please choose an image file.", true);
        return;
      }
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      selectedFile = file;
      lastResult = null;
      sourceSize = null;
      previewUrl = URL.createObjectURL(file);
      preview.onload = () => {
        sourceSize = {
          width: preview.naturalWidth,
          height: preview.naturalHeight,
        };
        updateOverlayAspectRatio();
        if (format.value === "overlay") renderResult();
      };
      preview.src = previewUrl;
      previewWrap.style.display = "block";
      runButton.disabled = false;
      output.textContent = "Ready to run OCR.";
      renderResult();
      setStatus(`${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MiB)`);
    }

    fileInput.addEventListener("change", () => selectFile(fileInput.files[0]));

    document.addEventListener("paste", (event) => {
      const imageItem = [...(event.clipboardData?.items ?? [])]
        .find((item) => item.type.startsWith("image/"));
      const file = imageItem?.getAsFile();
      if (!file) return;
      event.preventDefault();
      selectFile(file);
    });

    for (const eventName of ["dragenter", "dragover"]) {
      drop.addEventListener(eventName, (event) => {
        event.preventDefault();
        drop.classList.add("over");
      });
    }

    for (const eventName of ["dragleave", "drop"]) {
      drop.addEventListener(eventName, (event) => {
        event.preventDefault();
        drop.classList.remove("over");
      });
    }

    drop.addEventListener("drop", (event) => {
      selectFile(event.dataTransfer.files[0]);
    });

    async function decodeRgba(file) {
      const bitmap = await createImageBitmap(file);
      const canvas = document.createElement("canvas");
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      const context = canvas.getContext("2d", { willReadFrequently: true });
      context.drawImage(bitmap, 0, 0);
      bitmap.close();
      const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
      return {
        data: new Uint8Array(imageData.data.buffer),
        width: canvas.width,
        height: canvas.height,
      };
    }

    runButton.addEventListener("click", async () => {
      if (!selectedFile) return;
      runButton.disabled = true;
      lastResult = null;
      renderResult();
      output.textContent = "";
      const started = performance.now();

      try {
        setStatus("Decoding image in the browser…");
        const decoded = await decodeRgba(selectedFile);
        sourceSize = { width: decoded.width, height: decoded.height };
        updateOverlayAspectRatio();
        await new Promise((resolve) => setTimeout(resolve, 30));
        setStatus(`Running OCR on ${decoded.width} × ${decoded.height} pixels…`);
        const instance = await getOcr();
        lastResult = JSON.parse(instance.ocr_rgba(
          decoded.data,
          decoded.width,
          decoded.height,
          orient.checked,
        ));
        renderResult();
        setStatus(`Finished in ${(performance.now() - started).toFixed(0)} ms.`);
      } catch (error) {
        console.error(error);
        setStatus(String(error?.message ?? error), true);
      } finally {
        runButton.disabled = false;
      }
    });

    function resultMarkdown() {
      return lastResult?.markdown
        || lastResult?.lines?.map((line) => line.text).join("\n")
        || "";
    }

    function safeMarkdownFragment(html) {
      const template = document.createElement("template");
      template.innerHTML = html;

      template.content
        .querySelectorAll("script, style, iframe, object, embed, link, meta, base, form")
        .forEach((element) => element.remove());

      for (const element of template.content.querySelectorAll("*")) {
        for (const attribute of [...element.attributes]) {
          const value = attribute.value.trim();
          if (
            attribute.name.startsWith("on")
            || attribute.name === "style"
            || (/^(?:href|src|xlink:href)$/i.test(attribute.name)
              && /^(?:javascript|data:text\/html)/i.test(value))
          ) {
            element.removeAttribute(attribute.name);
          }
        }
        if (element.matches("a[href]")) {
          element.target = "_blank";
          element.rel = "noreferrer noopener";
        }
      }

      return template.content;
    }

    async function renderMarkdown(source, version) {
      try {
        await markdownReady;
        if (version !== resultRenderVersion) return;
        markdownOutput.replaceChildren(
          safeMarkdownFragment(md4xRenderToHtml(source)),
        );
      } catch (error) {
        if (version !== resultRenderVersion) return;
        setStatus(String(error?.message ?? error), true);
        const message = document.createElement("p");
        message.className = "empty-output";
        message.textContent = "The Markdown renderer could not be loaded.";
        markdownOutput.replaceChildren(message);
      }
    }

    function updateOverlayAspectRatio() {
      if (!sourceSize?.width || !sourceSize?.height) return;
      overlayPage.style.aspectRatio = `${sourceSize.width} / ${sourceSize.height}`;
    }

    function boxInOriginalOrientation([x0, y0, x1, y1], rotation) {
      if (!sourceSize) return [x0, y0, x1, y1];
      const corners = [[x0, y0], [x1, y0], [x0, y1], [x1, y1]];
      const mapped = corners.map(([x, y]) => {
        switch ((rotation + 360) % 360) {
          case 90: return [y, sourceSize.height - x];
          case 180: return [sourceSize.width - x, sourceSize.height - y];
          case 270: return [sourceSize.width - y, x];
          default: return [x, y];
        }
      });
      return [
        Math.min(...mapped.map(([x]) => x)),
        Math.min(...mapped.map(([, y]) => y)),
        Math.max(...mapped.map(([x]) => x)),
        Math.max(...mapped.map(([, y]) => y)),
      ];
    }

    function layoutOverlayLines() {
      if (!sourceSize || overlayOutput.hidden) return;
      const bounds = overlayPage.getBoundingClientRect();
      if (!bounds.width || !bounds.height) return;

      const scaleX = bounds.width / sourceSize.width;
      const scaleY = bounds.height / sourceSize.height;
      for (const line of overlayText.children) {
        const box = line.dataset.box.split(",").map(Number);
        const left = box[0] * scaleX;
        const top = box[1] * scaleY;
        const width = Math.max((box[2] - box[0]) * scaleX, 1);
        const height = Math.max((box[3] - box[1]) * scaleY, 1);
        line.style.left = `${left}px`;
        line.style.top = `${top}px`;
        line.style.width = `${width}px`;
        line.style.height = `${height}px`;
        line.style.fontSize = `${Math.max(height * 0.86, 6)}px`;
        line.style.lineHeight = `${height}px`;
      }
    }

    function renderOverlay() {
      overlayPage.style.backgroundImage = previewUrl ? `url("${previewUrl}")` : "";
      updateOverlayAspectRatio();
      overlayText.replaceChildren();

      if (!lastResult) {
        overlayHint.hidden = false;
        overlayHint.textContent = selectedFile
          ? "Run OCR to make the detected text selectable."
          : "Choose an image, then run OCR to make its text selectable.";
        return;
      }

      const lines = lastResult.lines || [];
      const rotation = Number(lastResult.rotation) || 0;
      for (const line of lines) {
        if (!line.text || !Array.isArray(line.bbox)) continue;
        const span = document.createElement("span");
        const box = boxInOriginalOrientation(line.bbox, rotation);
        span.className = "overlay-line";
        span.dataset.box = box.join(",");
        span.textContent = line.text;
        overlayText.append(span);
      }

      overlayHint.hidden = lines.length > 0;
      overlayHint.textContent = lines.length ? "" : "No text was detected in this image.";
      requestAnimationFrame(layoutOverlayLines);
    }

    function renderResult() {
      const version = ++resultRenderVersion;
      const mode = format.value;
      output.hidden = mode !== "json";
      markdownOutput.hidden = mode !== "markdown";
      overlayOutput.hidden = mode !== "overlay";

      if (mode === "json") {
        output.textContent = lastResult
          ? JSON.stringify(lastResult, null, 2)
          : selectedFile
            ? "Run OCR to see the JSON output."
            : "OCR output will appear here.";
      } else if (mode === "markdown") {
        if (lastResult) {
          renderMarkdown(resultMarkdown(), version);
        } else {
          const message = document.createElement("p");
          message.className = "empty-output";
          message.textContent = selectedFile
            ? "Run OCR to render the recognized Markdown."
            : "Recognized Markdown will appear here.";
          markdownOutput.replaceChildren(message);
        }
      } else {
        renderOverlay();
      }
    }

    format.addEventListener("change", renderResult);
    window.addEventListener("resize", layoutOverlayLines);
    renderResult();
    getOcr().catch((error) => setStatus(String(error?.message ?? error), true));
  </script>
</body>
</html>
