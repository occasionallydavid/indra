[package]
name = "indra-ocr"
version = "0.4.0"
edition = "2024"
description = "Fast CPU OCR inference for Indra's existing ONNX models"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
ort = "=2.0.0-rc.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
lto = "thin"
codegen-units = 1
