<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indra OCR WASM</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f1e8;
      --panel: #fffdf8;
      --ink: #1d1b18;
      --muted: #6e675d;
      --line: #d8d0c2;
      --accent: #c84b31;
      --accent-ink: #fff8f4;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171513;
        --panel: #211e1b;
        --ink: #f2ece2;
        --muted: #aaa195;
        --line: #484139;
        --accent: #ef7b5f;
        --accent-ink: #24100c;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 10% 0%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 35rem),
        var(--bg);
      color: var(--ink);
      font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1120px, calc(100% - 2rem));
      margin: 2rem auto 4rem;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    h1 {
      margin: 0;
      font-family: ui-serif, Georgia, serif;
      font-size: clamp(2rem, 7vw, 4.5rem);
      font-weight: 600;
      letter-spacing: -0.045em;
      line-height: 0.95;
    }

    .subtitle {
      max-width: 38rem;
      margin: 0.75rem 0 0;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      gap: 1rem;
    }

    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      box-shadow: 0 18px 60px rgb(0 0 0 / 0.08);
      overflow: hidden;
    }

    .drop {
      display: grid;
      min-height: 14rem;
      place-items: center;
      padding: 1.5rem;
      border: 2px dashed var(--line);
      border-radius: 14px;
      margin: 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .drop:hover, .drop.over {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 6%, transparent);
    }

    .drop strong { display: block; font-size: 1.1rem; }
    .drop span { color: var(--muted); }
    input[type="file"] { display: none; }

    .preview {
      display: none;
      max-height: 50vh;
      overflow: auto;
      padding: 0 1rem 1rem;
    }

    .preview img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid var(--line);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem;
      padding: 1rem;
      border-top: 1px solid var(--line);
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 0.75rem 1.15rem;
      background: var(--accent);
      color: var(--accent-ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    label.check {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--muted);
    }

    select {
      margin-left: auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.65rem 2rem 0.65rem 0.8rem;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
    }

    .status {
      min-height: 1.5rem;
      padding: 0 1rem 0.75rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .status.error { color: #d33c28; }

    pre {
      margin: 0;
      min-height: 25rem;
      max-height: 72vh;
      overflow: auto;
      padding: 1rem;
      border-top: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 50%, var(--panel));
      color: var(--ink);
      font: 0.88rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 780px) {
      .grid { grid-template-columns: 1fr; }
      header { display: block; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Indra OCR</h1>
        <p class="subtitle">
          Native Burn inference compiled to WebAssembly. Images are decoded by the
          browser; only grayscale pixels cross into WASM.
        </p>
      </div>
    </header>

    <section class="grid">
      <div class="panel">
        <label class="drop" id="drop">
          <div>
            <strong>Choose or drop a page</strong>
            <span>PNG, JPEG, WebP, TIFF, or any image your browser can decode</span>
          </div>
          <input id="file" type="file" accept="image/*">
        </label>
        <div class="preview" id="previewWrap">
          <img id="preview" alt="Selected page preview">
        </div>
        <div class="controls">
          <button id="run" disabled>Run OCR</button>
          <label class="check">
            <input id="orient" type="checkbox" checked>
            Detect page rotation
          </label>
          <select id="format" aria-label="Output format">
            <option value="markdown">Markdown</option>
            <option value="json">JSON</option>
          </select>
        </div>
        <div class="status" id="status">Ready.</div>
      </div>

      <div class="panel">
        <pre id="output">OCR output will appear here.</pre>
      </div>
    </section>
  </main>

  <script type="module">
    import init, { WebOcr } from "./pkg/indra_ocr.js";

    const fileInput = document.querySelector("#file");
    const drop = document.querySelector("#drop");
    const preview = document.querySelector("#preview");
    const previewWrap = document.querySelector("#previewWrap");
    const runButton = document.querySelector("#run");
    const orient = document.querySelector("#orient");
    const format = document.querySelector("#format");
    const status = document.querySelector("#status");
    const output = document.querySelector("#output");

    let selectedFile = null;
    let previewUrl = null;
    let ocrPromise = null;
    let ocr = null;
    let lastResult = null;

    async function getOcr() {
      if (!ocrPromise) {
        status.textContent = "Compiling and loading the OCR models…";
        ocrPromise = init()
          .then(() => new WebOcr())
          .then((instance) => {
            ocr = instance;
            return instance;
          })
          .catch((error) => {
            ocrPromise = null;
            throw error;
          });
      }
      return ocrPromise;
    }

    function setStatus(text, isError = false) {
      status.textContent = text;
      status.classList.toggle("error", isError);
    }

    function selectFile(file) {
      if (!file || !file.type.startsWith("image/")) {
        setStatus("Please choose an image file.", true);
        return;
      }
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      selectedFile = file;
      lastResult = null;
      previewUrl = URL.createObjectURL(file);
      preview.src = previewUrl;
      previewWrap.style.display = "block";
      runButton.disabled = false;
      output.textContent = "Ready to run OCR.";
      setStatus(`${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MiB)`);
    }

    fileInput.addEventListener("change", () => selectFile(fileInput.files[0]));

    for (const eventName of ["dragenter", "dragover"]) {
      drop.addEventListener(eventName, (event) => {
        event.preventDefault();
        drop.classList.add("over");
      });
    }

    for (const eventName of ["dragleave", "drop"]) {
      drop.addEventListener(eventName, (event) => {
        event.preventDefault();
        drop.classList.remove("over");
      });
    }

    drop.addEventListener("drop", (event) => {
      selectFile(event.dataTransfer.files[0]);
    });

    async function decodeRgba(file) {
      const bitmap = await createImageBitmap(file);
      const canvas = document.createElement("canvas");
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      const context = canvas.getContext("2d", { willReadFrequently: true });
      context.drawImage(bitmap, 0, 0);
      bitmap.close();
      const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
      return {
        data: new Uint8Array(imageData.data.buffer),
        width: canvas.width,
        height: canvas.height,
      };
    }

    runButton.addEventListener("click", async () => {
      if (!selectedFile) return;
      runButton.disabled = true;
      output.textContent = "";
      const started = performance.now();

      try {
        setStatus("Decoding image in the browser…");
        const decoded = await decodeRgba(selectedFile);
        await new Promise((resolve) => setTimeout(resolve, 30));
        setStatus(`Running OCR on ${decoded.width} × ${decoded.height} pixels…`);
        const instance = await getOcr();
        lastResult = JSON.parse(instance.ocr_rgba(
          decoded.data,
          decoded.width,
          decoded.height,
          orient.checked,
        ));
        renderResult();
        setStatus(`Finished in ${(performance.now() - started).toFixed(0)} ms.`);
      } catch (error) {
        console.error(error);
        setStatus(String(error?.message ?? error), true);
      } finally {
        runButton.disabled = false;
      }
    });

    function renderResult() {
      if (!lastResult) return;
      output.textContent = format.value === "json"
        ? JSON.stringify(lastResult, null, 2)
        : lastResult.markdown || lastResult.lines.map((line) => line.text).join("\n");
    }

    format.addEventListener("change", renderResult);
    getOcr().catch((error) => setStatus(String(error?.message ?? error), true));
  </script>
</body>
</html>
